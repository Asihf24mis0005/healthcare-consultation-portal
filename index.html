<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Healthcare Consultation Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f7f6; }
        h1 { color: #006666; border-bottom: 2px solid #006666; padding-bottom: 10px; }
        .panel { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn { background-color: #008080; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🏥 Online Healthcare Consultation Portal</h1>
    <div class="panel">
        <h3>Doctor Availability & Appointment Scheduling</h3>
        <p>Welcome to the patient care portal. Access medical records, connect with on-duty physicians, and securely schedule telemetry consultations here.</p>
        <button class="btn">Book New Appointment</button>
    </div>
</body>
</html>
