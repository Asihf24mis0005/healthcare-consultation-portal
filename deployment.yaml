apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-portal-deployment
  labels:
    app: healthcare-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: healthcare-portal
  template:
    metadata:
      labels:
        app: healthcare-portal
    spec:
      containers:
      - name: healthcare-container
        image: asihf/healthcare-portal:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-portal-service
spec:
  type: NodePort
  selector:
    app: healthcare-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32002
